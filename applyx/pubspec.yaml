name: applyx
description: "ApplyX — Agentic AI opportunity assistant for students and early-career users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.0+3

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
